name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# convex/_generated is committed to the repo, so no `convex codegen` step is
# needed here — typecheck/test/build all run against the committed types.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # package-lock.json is generated with npm 11, whose arborist prunes
      # optional peer subtrees (e.g. @docsearch/react's react<19 peers) that
      # npm 10's `npm ci` then reports as "missing from lock file". Pin the
      # same npm major here so validation matches generation.
      - run: npm install -g npm@11

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - run: npm run docs:build

  merchant-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build pinned merchant operations image
        run: >-
          docker build
          --pull
          --tag openstays-merchant-operations:${{ github.sha }}
          --file ops/cloudflare/container/Dockerfile
          .

      - name: Smoke-test bundled runtimes
        run: >-
          docker run --rm
          --entrypoint sh
          openstays-merchant-operations:${{ github.sha }}
          -c "node --version && ots --version && waved --version"

      - name: Drill wallet bootstrap, backup, and restore
        run: >-
          bash ops/cloudflare/tests/container-recovery-drill.sh
          openstays-merchant-operations:${{ github.sha }}

      # Keep the complete upstream report visible even when Lightning Labs has
      # not yet published a rebuilt Wavelength release. The deploy-blocking
      # scan below still rejects every fixable first-party/base-image finding.
      #
      # SHA-pinned because tags in the upstream Trivy action were compromised
      # in March 2026. This commit is the verified v0.36.0 release.
      - name: Report all high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: openstays-merchant-operations:${{ github.sha }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Reject fixable application and base-image vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: openstays-merchant-operations:${{ github.sha }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
        env:
          # Wavelength v0.1.0 is the only official release. Its complete scan
          # remains visible above; only Lightning Labs can ship a rebuilt
          # release, and the daemon is isolated to signet test funds.
          TRIVY_SKIP_FILES: /usr/local/bin/waved
