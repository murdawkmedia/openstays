name: CI

on:
  push:
    branches: [main]
  pull_request:

# convex/_generated is committed to the repo, so no `convex codegen` step is
# needed here — typecheck/test/build all run against the committed types.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - run: npm run docs:build
